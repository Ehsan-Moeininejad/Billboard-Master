name: Deploy site

# Publishes the app on GitHub Pages. Before upload it rebuilds Tehran's roads and districts from
# OpenStreetMap (data/roads.json, data/districts.json) so the site opens fast; if Overpass is down
# the site still works and falls back to live queries.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prebuild roads and districts
        run: node scripts/build-roads.mjs
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
