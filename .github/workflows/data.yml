name: Weekly data update

# Every 7 days: real Tehran billboard structures and their listed prices (Rasamap open dataset, MIT),
# traffic at each structure from the Neshan API (secret NESHAN_KEY), optional team price feed
# (data/price-sources.json), a fresh site deploy, and a summary email (secrets SMTP_USER, SMTP_PASS, MAIL_TO).
# GitHub's own schedule is a backup; the reliable trigger is cron-job.org calling workflow_dispatch
# (see SETUP.md).
# Other cities (Karaj, Isfahan, Mashhad, …) run in their own step after Tehran is committed, so they can never
# hold Tehran back: structures and prices every week, roads/hotspots/Neshan for two cities a week (scripts/update-cities.mjs).
on:
  schedule:
    - cron: '37 23 * * 4'   # Friday 03:07 Tehran
  workflow_dispatch:
    inputs:
      all_cities:
        description: 'Build roads, hotspots and traffic for every city now (first setup)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep last week's data for the comparison
        run: |
          mkdir -p .cache
          cp data/market.json .cache/prev-market.json 2>/dev/null || true
      - name: Download market listings
        id: download
        run: |
          mkdir -p .cache/rs
          base=https://raw.githubusercontent.com/alireza-zareian/Rasamap-Repository/main/scraper
          curl -fsSL "$base/data/billboards.json" -o .cache/rs/billboards.json
          curl -fsSL "$base/traffic_formula.py" -o .cache/rs/traffic_formula.py || true
      - name: Flag prices the source estimated itself
        run: |
          if [ -f .cache/rs/traffic_formula.py ]; then
            python3 scripts/flag-estimated.py .cache/rs/billboards.json .cache/rs .cache/rs/flagged.json
          else
            cp .cache/rs/billboards.json .cache/rs/flagged.json
          fi
      - name: Real roads for the location check
        id: roads
        run: node scripts/build-roads.mjs
        continue-on-error: true
      - name: Build market (structures + prices)
        id: market
        run: node scripts/build-market.mjs .cache/rs/flagged.json
      - name: Traffic from Neshan (needs the NESHAN_KEY secret)
        id: traffic
        env:
          NESHAN_KEY: ${{ secrets.NESHAN_KEY }}
          NESHAN_MAX_CALLS: ${{ vars.NESHAN_MAX_CALLS || '800' }}
        run: node scripts/update-traffic.mjs
        continue-on-error: true
      - name: Team price feed (if configured)
        id: prices
        run: node scripts/update-prices.mjs
        continue-on-error: true
      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/market.json data/prices.json data/price-history.csv
          git add data/traffic.json data/traffic-history.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: weekly snapshot $(date -u +%F)"
          git push
      - name: Other cities (after Tehran, separate commit)
        id: cities
        continue-on-error: true
        timeout-minutes: 150
        env:
          NESHAN_KEY: ${{ secrets.NESHAN_KEY }}
          NESHAN_CITY_CALLS: ${{ vars.NESHAN_CITY_CALLS || '250' }}
          CITIES_PER_WEEK: ${{ vars.CITIES_PER_WEEK || '2' }}
          CITIES_ALL: ${{ github.event.inputs.all_cities || 'false' }}
        run: |
          node scripts/update-cities.mjs .cache/rs/flagged.json
          git add data/cities data/cities.json data/cities-state.json
          git diff --cached --quiet || git commit -m "data: other cities $(date -u +%F)"
          git push
      - name: Redeploy site
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Weekly report
        if: always()
        env:
          MARKET_OUTCOME: ${{ steps.download.outcome == 'success' && steps.market.outcome || 'failure' }}
          ROADS_OUTCOME: ${{ steps.roads.outcome }}
          TRAFFIC_OUTCOME: ${{ steps.traffic.outcome }}
          PRICES_OUTCOME: ${{ steps.prices.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome == 'success' && steps.deploy.outcome || 'failure' }}
          CITIES_OUTCOME: ${{ steps.cities.outcome }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: node scripts/weekly-report.mjs
      - name: Email the report
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/send-report.py
