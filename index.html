<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بیلبوردسنج — تحلیل نقاط بیلبورد تهران</title>
  <meta name="description" content="انتخاب نقطه روی نقشه تهران، تخمین تردد، سرعت، زمان مواجهه و ایمپرشن بیلبورد، و مقایسه سازه‌ها برای تیم‌های مارکتینگ.">
  <meta name="theme-color" content="#0B0F17">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B8CFF'/%3E%3Crect x='7' y='8' width='18' height='10' rx='2' fill='white'/%3E%3Crect x='15' y='18' width='2' height='7' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-compare" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 18H4v-7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7h-3M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM5 11h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="13.5" r="1" fill="currentColor"/><circle cx="16.5" cy="13.5" r="1" fill="currentColor"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-speed" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17l4-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-money" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3M4 4v4h4M20 20v-4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 15v6M16 15v6" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z" fill="currentColor"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div id="map" aria-label="نقشه تهران"></div>

  <!-- top bar: brand + search -->
  <div class="topbar">
    <div class="brand" title="بیلبوردسنج">
      <span class="brand-logo"><svg><use href="#i-board"/></svg></span>
      <span class="brand-name">بیلبوردسنج</span>
      <span class="brand-city">تهران</span>
    </div>
    <div class="search" role="search">
      <svg class="search-ic"><use href="#i-search"/></svg>
      <input id="search" type="search" autocomplete="off" placeholder="جستجوی بزرگراه، پل، میدان…" aria-label="جستجو">
      <button class="search-clear" id="searchClear" aria-label="پاک کردن" hidden><svg><use href="#i-close"/></svg></button>
      <div class="search-results" id="searchResults" role="listbox" hidden></div>
    </div>
    <button class="guide-btn" id="btnGuide" aria-label="راهنمای شروع"><svg><use href="#i-info"/></svg><span>راهنما</span></button>
    <button class="data-chip model" id="dataChip" aria-label="منبع داده"><i></i><span><b>فقط مدل</b><small>کلید API ندارد</small></span></button>
  </div>

  <!-- map tools -->
  <div class="map-tools">
    <div class="tool-group">
      <button class="tool" id="btnLayers" aria-label="لایه‌ها" data-tip="لایه‌ها"><svg><use href="#i-layers"/></svg></button>
      <button class="tool" id="btnSettings" aria-label="تنظیمات و اتصال داده" data-tip="تنظیمات و داده"><svg><use href="#i-settings"/></svg><span class="tool-dot" id="dataDot"></span></button>
      <button class="tool" id="btnHelp" aria-label="روش محاسبه" data-tip="روش محاسبه و محدودیت‌ها"><svg><use href="#i-info"/></svg></button>
    </div>
    <div class="layers-pop" id="layersPop" hidden>
      <div class="pop-title">نقشه پایه</div>
      <div class="basemaps" id="basemaps"></div>
      <div class="pop-title">لایه‌های کمکی</div>
      <label class="switch-row"><input type="checkbox" id="lyrHighways"><span class="switch"></span><span><b>شبکه بزرگراه‌ها</b><small>بزرگراه‌ها و آزادراه‌های تهران</small></span></label>
      <label class="switch-row"><input type="checkbox" id="lyrDistricts"><span class="switch"></span><span><b>مناطق شهرداری</b><small>22 منطقه تهران؛ کلیک روی منطقه، سازه‌هایش را نشان می‌دهد</small></span></label>
      <label class="switch-row"><input type="checkbox" id="lyrStructures"><span class="switch"></span><span><b>سازه‌های موجود</b><small>سازه‌های واقعی بازار و فهرست شما (+ پل‌های OSM در زوم 14+)</small></span></label>
    </div>
  </div>

  <div class="mode-hint" id="modeHint"><svg><use href="#i-target"/></svg><span>روی هر نقطه از بزرگراه یا پل کلیک کنید تا تحلیل شود</span></div>

  <!-- side panel -->
  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-grip" id="panelGrip" aria-hidden="true"></div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <!-- comparison sheet -->
  <section class="sheet" id="sheet" hidden aria-label="مقایسه نقاط">
    <div class="sheet-inner" id="sheetInner"></div>
  </section>

  <!-- dialogs -->
  <dialog id="dlgSettings" class="dlg"></dialog>
  <dialog id="dlgHelp" class="dlg dlg-wide"></dialog>
  <dialog id="dlgImport" class="dlg dlg-wide"></dialog>
  <dialog id="dlgCopy" class="dlg"></dialog>
  <dialog id="dlgWelcome" class="dlg dlg-wide dlg-welcome"></dialog>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
